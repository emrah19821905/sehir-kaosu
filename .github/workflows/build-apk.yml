name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      # Her zaman kurulabilir debug APK üretir
      - name: Debug APK
        run: gradle assembleDebug --no-daemon

      # Secrets tanımlıysa imzalı release APK + AAB üretir
      - name: Release anahtarını hazırla
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > sehirkaosu-release.jks
          cat > keystore.properties <<PROPS
          storeFile=sehirkaosu-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Release APK + AAB
        if: env.KS_B64 != ''
        run: gradle assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sehir-kaosu-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/release/*.aab

      # v1.0.0 gibi bir etiket (tag) gönderince Releases sayfasına ekler
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/release/*.aab
